    <div id="photoBox" onclick="if(event.target==this){closePhotoBox();}" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; text-align:center;">
        <img id="photoBoxImage" alt="big photo" style="max-width:90%; max-height:80vh; margin-top:5vh; border:5px inset gold; border-radius:10px; box-shadow:5px 5px 10px;">
        <br>
        <button onclick="closePhotoBox()" style="background:linear-gradient(to left, blue, red); color:gold; border:3px inset gold; border-radius:10px; font-size:24px; font-weight:bold; padding:5px 15px; margin-top:15px; cursor:pointer;">X</button>
    </div>
    <script>
    function openPhotoBox(photoSource){
        document.getElementById('photoBoxImage').src = photoSource;
        document.getElementById('photoBox').style.display = 'block';
    }
    function closePhotoBox(){
        document.getElementById('photoBox').style.display = 'none';
    }
    </script>
